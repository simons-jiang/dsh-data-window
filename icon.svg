<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Database window">
  <defs>
    <linearGradient id="dw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="1" stop-color="#14202e"/>
    </linearGradient>
    <linearGradient id="dw-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63a4ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#dw-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#2b3a4d" stroke-width="1"/>

  <!-- database cylinder -->
  <ellipse cx="24" cy="18.5" rx="12.5" ry="4.8" fill="#7fb6ff" opacity="0.95"/>
  <path d="M11.5 18.5v20c0 2.65 5.6 4.8 12.5 4.8s12.5-2.15 12.5-4.8v-20" fill="url(#dw-body)"/>
  <path d="M11.5 26.6c0 2.65 5.6 4.8 12.5 4.8s12.5-2.15 12.5-4.8" fill="none" stroke="#123152" stroke-opacity="0.45" stroke-width="1.6"/>
  <path d="M11.5 34.3c0 2.65 5.6 4.8 12.5 4.8s12.5-2.15 12.5-4.8" fill="none" stroke="#123152" stroke-opacity="0.35" stroke-width="1.6"/>

  <!-- result grid -->
  <rect x="33" y="30" width="21" height="17" rx="2.6" fill="#0f1b29" stroke="#89b7ff" stroke-width="1.3"/>
  <path d="M33 35.4h21" stroke="#89b7ff" stroke-width="1.1" opacity="0.85"/>
  <path d="M40.4 35.4v11.6M47.2 35.4v11.6" stroke="#89b7ff" stroke-width="0.9" opacity="0.5"/>
  <rect x="34.4" y="31.4" width="18.2" height="3" rx="1.2" fill="#2f6fd0" opacity="0.75"/>

  <!-- caret after the SQL prompt -->
  <path d="M36 51.5h9" stroke="#7fb6ff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M46.5 48.6l4 2.9-4 2.9z" fill="#7fb6ff"/>
</svg>
